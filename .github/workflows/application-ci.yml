name: CI

on:
  push:
    branches:
      - 'main'
      - 'fix/**'
      - 'chore/**'
      - 'feat/**'
      - '!feat/notebooks**'

  pull_request:
    branches:
      - 'main'

jobs:
  ##############################################################################
  # Code Quality
  ##############################################################################
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --dev

      - name: Ruff Lint & Import Check
        run: uv run ruff check .

      - name: Ruff Format Check
        run: uv run ruff format .

      - name: MyPy
        run: |
          uv run mypy .

  ##############################################################################
  # Unit Tests
  ##############################################################################
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --dev

      - name: Run Unit Tests
        run: |
          uv run pytest tests/unit -v

  ##############################################################################
  # Integration Tests
  ##############################################################################
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --dev

      - name: Run Integration Tests
        run: |
          uv run pytest tests/integration -v

  ##############################################################################
  # Build Package
  ##############################################################################
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --dev

      - name: Build package
        run: uv build
